<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ドラゴンクエスト1風 RPG プロトタイプ</title>
    
    <!-- PWA & Mobile Web App 設定 -->
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="レトロRPG">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <header class="header-bar">
            <span class="title-tag">⚔️ DRAGON QUEST I 風 RPG <span style="font-size:0.75em; opacity:0.75; font-weight:normal;">v2.0.4</span></span>
            <div class="header-actions">
                <button id="debugBtn" class="header-btn" onclick="toggleDebugModal()">🧪 テスト</button>
                <button id="soundToggle" class="header-btn" onclick="toggleMute()">🔊 サウンド: ON</button>
                <button id="quitBtn" class="header-btn quit-btn" onclick="quitGame()">🛑 やめる</button>
            </div>
        </header>

        <!-- デバッグ・テストメニューモーダル -->
        <div id="debugModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; color: white;">
            <div style="background: #111; border: 2px solid #58a6ff; border-radius: 8px; padding: 16px; width: 90%; max-width: 400px; font-family: monospace;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px;">
                    <span style="font-weight: bold; color: #58a6ff; font-size: 16px;">🧪 テスト・デバッグツール</span>
                    <button onclick="toggleDebugModal()" style="background: #e63e3e; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer;">✕ 閉じる</button>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px;">
                    <div style="color: #ffcc00; font-weight: bold;">【章ワープ ＆ レベル同期】</div>
                    <button onclick="debugSetChapter(1)" style="padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer; text-align: left;">🌲 第1章: ラダトーム城 (LV1・ひのきのぼう)</button>
                    <button onclick="debugSetChapter(2)" style="padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer; text-align: left;">🏜️ 第2章: 砂漠・火山 (LV5・どうのつるぎ・銀の鍵)</button>
                    <button onclick="debugSetChapter(3)" style="padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer; text-align: left;">🏰 第3章: 竜王の城 (LV8・はがねのつるぎ・虹のしずく)</button>
                    
                    <div style="color: #ffcc00; font-weight: bold; margin-top: 6px;">【便利チート】</div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                        <button onclick="debugAddGold(500)" style="padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer;">💰 G+500</button>
                        <button onclick="debugFullHeal()" style="padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer;">✨ 全回復</button>
                        <button onclick="debugAddItems()" style="padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer;">🌿 道具MAX</button>
                        <button id="btnEncounterToggle" onclick="debugToggleEncounter()" style="padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer;">🚫 敵: ON</button>
                    </div>
                </div>
            </div>
        </div>

        <main class="canvas-wrapper">
            <canvas id="gameCanvas" width="480" height="640"></canvas>
        </main>

        <section class="controls-container">
            <!-- スマホ・タッチ用 バーチャルパッド -->
            <div class="virtual-pad">
                <div class="dpad-container">
                    <button id="btnUp" class="pad-btn btn-up" aria-label="上">▲</button>
                    <button id="btnDown" class="pad-btn btn-down" aria-label="下">▼</button>
                    <button id="btnLeft" class="pad-btn btn-left" aria-label="左">◀</button>
                    <button id="btnRight" class="pad-btn btn-right" aria-label="右">▶</button>
                </div>
                <div class="action-buttons">
                    <button id="btnB" class="action-btn btn-b" aria-label="Bボタン">
                        <span>B</span>
                        <span class="btn-sub">戻る</span>
                    </button>
                    <button id="btnA" class="action-btn btn-a" aria-label="Aボタン">
                        <span>A</span>
                        <span class="btn-sub">決定/話す</span>
                    </button>
                </div>
            </div>
        </section>
    </div>

    <!-- ゲームスクリプト読み込み -->
    <script src="js/audio.js"></script>
    <script src="js/data.js"></script>
    <script src="js/graphics.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/main.js"></script>

    <script>
        function toggleMute() {
            if (typeof audio !== 'undefined') {
                audio.isMuted = !audio.isMuted;
                if (audio.isMuted) {
                    audio.stopBGM();
                } else if (window.game && window.game.state === 'EXPLORE') {
                    audio.playBGM(window.game.currentMap.bgm);
                }
                const btn = document.getElementById('soundToggle');
                btn.textContent = audio.isMuted ? '🔇 サウンド: OFF' : '🔊 サウンド: ON';
            }
        }

        function quitGame() {
            if (confirm('ゲームを終了してアプリを閉じますか？')) {
                // 音声を完全停止
                if (typeof audio !== 'undefined') {
                    audio.stopBGM();
                    audio.isMuted = true;
                }
                // アプリ・ウィンドウを閉じる試み
                try {
                    window.open('', '_self', '');
                    window.close();
                } catch (e) {}

                // ブラウザの制限でタブが閉じない場合の終了画面表示
                setTimeout(() => {
                    document.body.innerHTML = `
                        <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; height:100dvh; background:#000000; color:#aaaaaa; font-family:monospace; text-align:center; padding:20px;">
                            <div style="font-size:36px; margin-bottom:16px;">⚔️</div>
                            <div style="font-size:18px; color:#ffffff; font-weight:bold; margin-bottom:12px;">ゲームを終了しました</div>
                            <div style="font-size:13px; line-height:1.6; color:#888888;">端末のホーム画面に戻るか、<br>画面・タブを閉じてください。</div>
                            <button onclick="location.reload()" style="margin-top:32px; background:#2a2a36; color:#ffffff; border:1px solid #555; padding:8px 18px; border-radius:4px; font-size:13px; cursor:pointer;">▶ もう一度遊ぶ</button>
                        </div>
                    `;
                }, 100);
            }
        }
        // Service Workerの登録（PWA・完全オフライン対応）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then((reg) => {
                        console.log('[PWA] Service Worker registered successfully! Scope:', reg.scope);
                    })
                    .catch((err) => {
                        console.error('[PWA] Service Worker registration failed:', err);
                    });
            });
        }
    </script>
</body>
</html>
